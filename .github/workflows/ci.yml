name: Secure GitOps CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate deployment policy
        run: python src/validate_manifests.py manifests/app.yaml
